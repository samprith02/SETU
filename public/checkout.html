<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setu — Test Checkout</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
      button { font: inherit; padding: 0.6rem 1.2rem; cursor: pointer; }
      pre { background: #f4f4f5; padding: 0.75rem; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
      .ok { color: #15803d; } .bad { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>Setu — test checkout</h1>
    <p>Harness for the Razorpay test-mode payment loop. Two modes:
      <code>?orderId=…</code> pays an order an agent already created through the
      mandate gate; <code>?productId=…</code> creates a fresh ungated order
      (default: <code>cbl-usbc-1m</code>).</p>
    <p id="intent" hidden></p>

    <p><strong id="summary">Loading…</strong></p>
    <button id="pay" disabled>Pay with Razorpay</button>
    <h2>Log</h2>
    <pre id="log"></pre>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const orderId = params.get("orderId");
      const productId = params.get("productId") || "cbl-usbc-1m";
      const logEl = document.getElementById("log");
      const payBtn = document.getElementById("pay");
      let checkout = null;

      const log = (msg, cls) => {
        const line = document.createElement("div");
        if (cls) line.className = cls;
        line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
        logEl.appendChild(line);
      };
      const rupees = (paise) => "₹" + (paise / 100).toFixed(2);

      // Step 1: get an order to pay.
      //
      // Two paths, and the difference matters. With ?orderId= the order ALREADY
      // EXISTS — an agent created it through the MCP mandate gate, which
      // approved the amount before Razorpay was ever contacted. This page must
      // pay that order, not mint a new one: creating a second order here would
      // route around the gate and pay for something nothing had approved.
      //
      // With ?productId= there is no mandate involved at all. That is the
      // deliberately ungated path, kept only to prove the payment rails work in
      // a browser. Either way the amount is decided server-side from the
      // catalog — the browser never names a price.
      async function init() {
        let res, data;
        if (orderId) {
          log(`GET /order/${orderId} — paying an order the agent already created`);
          res = await fetch(`/order/${encodeURIComponent(orderId)}`);
          data = await res.json();
        } else {
          log(`POST /checkout { productId: "${productId}" }  (ungated path)`);
          res = await fetch("/checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ productId }),
          });
          data = await res.json();
        }

        if (!res.ok) {
          document.getElementById("summary").textContent = orderId
            ? "Could not load that order."
            : "Failed to create order.";
          log(`error: ${JSON.stringify(data)}`, "bad");
          return;
        }

        const name = data.product ? data.product.name : data.order_id;
        log(
          orderId
            ? `order loaded: ${data.order_id} for ${rupees(data.amount)} (status: ${data.status})`
            : `order created: ${data.order_id} for ${rupees(data.amount)}`,
          "ok",
        );
        document.getElementById("summary").textContent = `${name} — ${rupees(data.amount)}`;

        // The agent's stated reason, carried from the audit ledger. Showing it
        // to the human who is about to pay is the point of recording it.
        if (data.intent) {
          const intentEl = document.getElementById("intent");
          intentEl.textContent = `Agent's stated intent: "${data.intent}"`;
          intentEl.hidden = false;
        }

        // An order Razorpay has already marked paid must not be offered again.
        if (data.status === "paid") {
          log("this order is already paid — nothing to do", "ok");
          return;
        }

        checkout = data;
        payBtn.disabled = false;
      }

      payBtn.addEventListener("click", () => {
        const rzp = new Razorpay({
          key: checkout.key_id,
          order_id: checkout.order_id,
          amount: checkout.amount,
          currency: checkout.currency,
          name: "Setu Campus Tech Essentials",
          description: checkout.product ? checkout.product.name : checkout.order_id,
          // Step 3: Razorpay hands back a payment id and a signature.
          handler: async (response) => {
            log(`payment returned: ${response.razorpay_payment_id}`);
            log("POST /payment/verify — recomputing signature, then confirming capture…");
            const verifyRes = await fetch("/payment/verify", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(response),
            });
            const result = await verifyRes.json();
            log(JSON.stringify(result), result.captured ? "ok" : "bad");

            // Three separate claims, reported separately — a genuine signature
            // is not a captured payment, and a captured payment is only counted
            // against the mandate if it came through the gate.
            log(
              result.verified
                ? "VERIFIED — signature matched, the callback is genuine."
                : "REJECTED — signature did not match.",
              result.verified ? "ok" : "bad",
            );
            if (result.verified) {
              log(
                result.captured
                  ? "CAPTURED — Razorpay confirms the money moved."
                  : `NOT CAPTURED — ${result.error}. No money moved.`,
                result.captured ? "ok" : "bad",
              );
            }
            if (result.captured) {
              log(
                result.counted
                  ? `COUNTED against the mandate. Total spent: ${rupees(result.total_spent)}`
                  : "not counted against any mandate (ungated checkout).",
                "ok",
              );
            }
          },
          modal: { ondismiss: () => log("checkout dismissed by user") },
          theme: { color: "#0f766e" },
        });
        rzp.on("payment.failed", (e) =>
          log(`payment failed: ${e.error.description}`, "bad"),
        );
        // Step 2: open Razorpay's hosted checkout. Card details are entered
        // inside Razorpay's iframe and never touch this page or our server.
        rzp.open();
      });

      init();
    </script>
  </body>
</html>
